# Klimaspuren – Jekyll / GitHub Pages / Minimal Mistakes 4.28.0
# Repository: https://github.com/Obertjo/klimaspuren
remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "mint"
locale: "de-DE"
title: "Klimaspuren"
subtitle: "Grünstrukturen und Stadtklima entdecken"
description: "Offenes Lernangebot über Grünstrukturen, Versiegelung und Stadtklima mit Kartenvergleich und eigener Beobachtungserfassung."
url: "https://obertjo.github.io"
baseurl: "/klimaspuren"
repository: "Obertjo/klimaspuren"
markdown: kramdown
permalink: pretty
search: false
breadcrumbs: false
plugins:
  - jekyll-include-cache
# Alternativ später: minimale Anpassung der Theme-Farben über 'minimal_mistakes_skin'.
footer:
  links:
    - label: "Quellcode auf GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Obertjo/klimaspuren"
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE-CODE
  - .gitignore
